<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Axon AI — Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
:root {
  --bg:     #04080F;
  --bg2:    #070D19;
  --bg3:    #0B1220;
  --bg4:    #101828;
  --bg5:    #141E2E;
  --blue:   #1A6CF6;
  --blue2:  #1458CC;
  --blue3:  #3B82F6;
  --blue4:  #60A5FA;
  --blue5:  #93C5FD;
  --glow:   rgba(26,108,246,.22);
  --bd:     rgba(255,255,255,.055);
  --bd2:    rgba(59,130,246,.14);
  --bd3:    rgba(59,130,246,.24);
  --muted:  #2E3D58;
  --muted2: #566480;
  --muted3: #8A9BB8;
  --white:  #EDF2FF;
  --green:  #22c55e;
  --sw:     262px;
  --fh:     'Syne', sans-serif;
  --fb:     'DM Sans', sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--white);font-family:var(--fb);display:flex}
::-webkit-scrollbar{width:2px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg5);border-radius:2px}

/* ── SIDEBAR ── */
.sidebar{
  width:var(--sw);flex-shrink:0;
  background:var(--bg2);
  border-right:1px solid var(--bd);
  display:flex;flex-direction:column;
  height:100vh;overflow:hidden;
  position:relative;z-index:10;
}
.sb-head{
  height:56px;border-bottom:1px solid var(--bd);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 1rem;flex-shrink:0;
}
.sb-brand{
  display:flex;align-items:center;gap:8px;
  text-decoration:none;color:var(--white);
}
.sb-logo{
  width:26px;height:26px;border-radius:7px;overflow:hidden;
  border:1px solid var(--bd3);
  box-shadow:0 0 12px var(--glow);flex-shrink:0;
}
.sb-logo img{width:100%;height:100%;object-fit:cover;display:block;}
.sb-brand-text{font-family:var(--fh);font-weight:800;font-size:.88rem;letter-spacing:-.01em;}
.sb-brand-text em{color:var(--blue4);font-style:normal;}
.btn-new{
  display:flex;align-items:center;gap:4px;
  padding:5px 10px;border-radius:5px;
  border:1px solid var(--bd2);background:transparent;
  color:var(--muted3);font-family:var(--fh);font-size:.68rem;font-weight:700;
  cursor:pointer;transition:all .18s;letter-spacing:.03em;
}
.btn-new:hover{background:rgba(26,108,246,.1);border-color:var(--bd3);color:var(--blue4);}

.sb-label{
  padding:.8rem 1rem .3rem;
  font-size:.56rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);flex-shrink:0;
}
.sb-list{flex:1;overflow-y:auto;padding:0 .5rem .5rem;}
.sitem{
  display:flex;align-items:center;gap:7px;
  padding:7px 8px;border-radius:7px;
  cursor:pointer;transition:background .15s;
  margin-bottom:2px;
}
.sitem:hover{background:var(--bg3);}
.sitem.active{background:rgba(26,108,246,.08);border:1px solid rgba(59,130,246,.1);}
.sitem-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);flex-shrink:0;}
.sitem.active .sitem-dot{background:var(--blue3);}
.sitem-info{flex:1;min-width:0;}
.sitem-name{font-family:var(--fh);font-size:.72rem;font-weight:700;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sitem.active .sitem-name{color:var(--blue4);}
.sitem-prev{font-size:.64rem;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.sitem-del{
  width:18px;height:18px;border-radius:3px;border:none;
  background:transparent;color:var(--muted);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:.6rem;opacity:0;transition:all .15s;flex-shrink:0;
}
.sitem:hover .sitem-del{opacity:1;}
.sitem-del:hover{background:rgba(26,108,246,.15);color:var(--blue4);}
.sb-foot{
  padding:.9rem 1rem;border-top:1px solid var(--bd);flex-shrink:0;
  font-size:.64rem;color:var(--muted2);line-height:1.7;
}
.sb-foot a{color:var(--blue3);text-decoration:none;font-weight:600;}
.sb-foot a:hover{color:var(--blue4);}

/* ── CHAT MAIN ── */
.chat-main{flex:1;display:flex;flex-direction:column;height:100vh;overflow:hidden;min-width:0;}

/* TOPBAR */
.topbar{
  height:56px;border-bottom:1px solid var(--bd);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 1.4rem;flex-shrink:0;
  background:rgba(4,8,15,.9);backdrop-filter:blur(20px);
}
.topbar-l{display:flex;align-items:center;gap:10px;}
.topbar-r{display:flex;align-items:center;gap:7px;}
.sb-toggle{
  display:none;width:30px;height:30px;border-radius:5px;
  background:transparent;border:1px solid var(--bd);color:var(--muted3);
  cursor:pointer;align-items:center;justify-content:center;
}
.sess-label{font-family:var(--fh);font-size:.7rem;font-weight:700;color:var(--muted2);letter-spacing:.04em;}
.sess-label em{color:var(--blue4);font-style:normal;}

/* model selector */
.model-wrap{position:relative;}
.model-btn{
  display:flex;align-items:center;gap:5px;
  padding:5px 11px;border-radius:6px;
  border:1px solid var(--bd2);background:rgba(26,108,246,.06);
  color:var(--blue4);font-family:var(--fh);font-size:.67rem;font-weight:700;
  letter-spacing:.06em;cursor:pointer;transition:all .2s;white-space:nowrap;
}
.model-btn:hover{background:rgba(26,108,246,.12);border-color:var(--bd3);}
.model-btn svg{transition:transform .2s;}
.model-btn.open svg{transform:rotate(180deg);}
.model-drop{
  position:absolute;top:calc(100% + 7px);right:0;min-width:220px;
  background:var(--bg4);border:1px solid var(--bd2);
  border-radius:10px;padding:.35rem;z-index:300;display:none;
  box-shadow:0 16px 48px rgba(0,0,0,.6);
  animation:popIn .15s ease;
}
.model-drop.show{display:block;}
@keyframes popIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.mopt{
  display:flex;align-items:center;gap:8px;
  padding:.5rem .65rem;border-radius:7px;cursor:pointer;transition:background .15s;
}
.mopt:hover{background:var(--bg5);}
.mopt.active{background:rgba(26,108,246,.08);}
.mopt-icon{
  width:26px;height:26px;border-radius:6px;
  background:rgba(26,108,246,.1);border:1px solid var(--bd2);
  display:flex;align-items:center;justify-content:center;
  font-size:.7rem;flex-shrink:0;
}
.mopt-name{font-family:var(--fh);font-size:.75rem;font-weight:700;color:var(--white);}
.mopt.active .mopt-name{color:var(--blue4);}
.mopt-desc{font-size:.62rem;color:var(--muted2);margin-top:1px;line-height:1.35;}
.mopt-badge{font-size:.52rem;padding:1px 5px;border-radius:3px;background:rgba(26,108,246,.12);border:1px solid var(--bd2);color:var(--blue4);font-family:var(--fh);font-weight:700;letter-spacing:.06em;margin-left:4px;vertical-align:middle;}

.tbtn{
  display:flex;align-items:center;gap:5px;
  padding:5px 10px;border-radius:5px;
  border:1px solid var(--bd);background:transparent;
  color:var(--muted3);font-family:var(--fb);font-size:.7rem;
  cursor:pointer;transition:all .18s;
}
.tbtn:hover{color:var(--white);border-color:var(--bd2);background:rgba(255,255,255,.03);}
.back-btn{
  display:flex;align-items:center;gap:5px;
  padding:5px 12px;border-radius:5px;
  border:1px solid var(--bd);background:transparent;
  color:var(--muted3);font-family:var(--fb);font-size:.7rem;
  cursor:pointer;text-decoration:none;transition:all .18s;
}
.back-btn:hover{color:var(--white);border-color:var(--bd2);}

/* MESSAGES */
.msgs{flex:1;overflow-y:auto;padding:1.5rem 1.2rem;display:flex;flex-direction:column;gap:14px;}

.empty-state{
  margin:auto;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:.8rem;text-align:center;padding:2rem;
  pointer-events:none;user-select:none;
}
.empty-logo{width:64px;height:64px;border-radius:18px;overflow:hidden;opacity:.22;margin-bottom:.4rem;}
.empty-logo img{width:100%;height:100%;object-fit:cover;display:block;}
.empty-title{font-family:var(--fh);font-size:1.15rem;font-weight:800;opacity:.14;letter-spacing:-.02em;}
.empty-sub{font-size:.73rem;color:var(--muted2);opacity:.5;max-width:240px;line-height:1.75;}

.msg{display:flex;gap:10px;max-width:780px;margin:0 auto;width:100%;animation:mup .2s ease;}
.msg.user{flex-direction:row-reverse;}
@keyframes mup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg-av{
  width:28px;height:28px;border-radius:7px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--fh);font-size:.55rem;font-weight:800;margin-top:2px;
}
.msg.bot .msg-av{background:rgba(26,108,246,.1);color:var(--blue3);border:1px solid var(--bd2);}
.msg.user .msg-av{background:var(--bg4);color:var(--muted3);border:1px solid var(--bd);}
.msg-body{flex:1;min-width:0;}
.msg-who{
  font-family:var(--fh);font-size:.56rem;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;
  margin-bottom:.28rem;color:var(--muted2);
  display:flex;align-items:center;gap:7px;
}
.msg.user .msg-who{flex-direction:row-reverse;}
.msg-copy-btn{
  background:transparent;border:none;color:var(--muted);cursor:pointer;
  padding:2px 5px;border-radius:4px;font-size:.58rem;
  transition:all .15s;display:flex;align-items:center;gap:3px;
}
.msg-copy-btn:hover{color:var(--muted3);background:rgba(255,255,255,.04);}
.msg-copy-btn.copied{color:#86efac;}
.msg.user .msg-body{display:flex;flex-direction:column;align-items:flex-end;}
.msg-bub{
  display:inline-block;padding:9px 13px;border-radius:10px;
  font-size:.875rem;line-height:1.72;max-width:100%;
}
.msg.user .msg-bub{background:var(--blue);border-radius:10px 2px 10px 10px;}
.msg.bot .msg-bub{
  background:var(--bg3);border:1px solid var(--bd);
  border-radius:2px 10px 10px 10px;text-align:left;
}
.msg.bot .msg-bub p{margin-bottom:.35em;}
.msg.bot .msg-bub p:last-child{margin:0;}
.msg.bot .msg-bub strong{color:var(--white);}
.msg.bot .msg-bub a{color:var(--blue4);text-decoration:none;}
.msg.bot .msg-bub a:hover{text-decoration:underline;}
.msg.bot .msg-bub ul,.msg.bot .msg-bub ol{padding-left:1.2em;margin:.3em 0;}
.msg.bot .msg-bub li{margin-bottom:.2em;}

/* code blocks */
.msg.bot .msg-bub pre{position:relative;background:#060b14;border:1px solid var(--bd2);border-radius:8px;margin:.6em 0;overflow:hidden;}
.msg.bot .msg-bub pre .code-hd{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--bd);}
.msg.bot .msg-bub pre .code-lang{font-size:.6rem;font-family:var(--fh);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted3);}
.msg.bot .msg-bub pre .code-copy{font-size:.63rem;padding:3px 10px;border-radius:4px;border:1px solid var(--bd2);background:transparent;color:var(--muted3);cursor:pointer;font-family:var(--fb);transition:all .18s;}
.msg.bot .msg-bub pre .code-copy:hover{color:var(--white);background:rgba(255,255,255,.05);}
.msg.bot .msg-bub pre .code-copy.copied{color:#86efac;border-color:rgba(34,197,94,.25);}
.msg.bot .msg-bub pre code{display:block;padding:12px 14px;overflow-x:auto;font-size:.8rem;line-height:1.7;color:#b8c4d8;background:none;font-family:'Fira Code','Cascadia Code',Consolas,monospace;}
.msg.bot .msg-bub code:not(pre code){background:rgba(26,108,246,.1);padding:1px 5px;border-radius:3px;font-size:.8em;color:var(--blue4);}

/* typing */
.tdots{display:flex;align-items:center;gap:4px;padding:4px 0;}
.tdots span{width:4px;height:4px;background:var(--muted2);border-radius:50%;animation:td 1.1s infinite ease-in-out;}
.tdots span:nth-child(2){animation-delay:.18s;}
.tdots span:nth-child(3){animation-delay:.36s;}
@keyframes td{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}

/* tool badges */
.tool-badge{display:inline-flex;align-items:center;gap:6px;font-size:.66rem;padding:4px 10px;border-radius:5px;margin-bottom:.6rem;font-family:var(--fh);font-weight:700;letter-spacing:.05em;animation:mup .2s ease;}
.tool-badge.searching{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2);color:var(--blue5);}
.tool-badge.done{background:rgba(34,197,94,.07);border:1px solid rgba(34,197,94,.18);color:#86efac;}
.tool-badge.err{background:rgba(26,108,246,.07);border:1px solid rgba(26,108,246,.18);color:var(--blue4);}
.tool-badge svg{width:10px;height:10px;}

/* tool results */
.tool-result{margin-top:.7rem;width:100%;}
.search-results{display:flex;flex-direction:column;gap:7px;}
.search-item{background:var(--bg4);border:1px solid var(--bd);border-radius:8px;padding:.75rem .9rem;transition:border .18s;}
.search-item:hover{border-color:var(--bd2);}
.search-item-title{font-size:.8rem;font-weight:600;color:var(--white);margin-bottom:.2rem;font-family:var(--fh);}
.search-item-snippet{font-size:.73rem;color:var(--muted3);line-height:1.55;}
.search-item-url{font-size:.63rem;color:var(--muted2);margin-top:.28rem;}

/* tiktok profile */
.tiktok-profile{background:var(--bg4);border:1px solid var(--bd);border-radius:10px;padding:1rem;display:flex;gap:.9rem;align-items:flex-start;}
.tiktok-avatar{width:60px;height:60px;border-radius:50%;border:2px solid var(--bd2);flex-shrink:0;object-fit:cover;background:var(--bg3);}
.tiktok-info{flex:1;min-width:0;}
.tiktok-nickname{font-family:var(--fh);font-size:.92rem;font-weight:800;color:var(--white);margin-bottom:.08rem;}
.tiktok-username{font-size:.7rem;color:var(--muted2);margin-bottom:.55rem;}
.tiktok-bio{font-size:.73rem;color:var(--muted3);line-height:1.6;margin-bottom:.65rem;}
.tiktok-stats{display:flex;gap:.9rem;flex-wrap:wrap;}
.tiktok-stat-num{font-family:var(--fh);font-size:.88rem;font-weight:800;color:var(--white);display:block;}
.tiktok-stat-lbl{font-size:.59rem;color:var(--muted2);text-transform:uppercase;letter-spacing:.07em;}
.tiktok-verified{display:inline-flex;align-items:center;gap:3px;font-size:.63rem;color:var(--blue3);margin-left:4px;}

/* video grid */
.video-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;}
.video-card{background:var(--bg4);border:1px solid var(--bd);border-radius:9px;overflow:hidden;cursor:pointer;transition:all .2s;position:relative;}
.video-card:hover{border-color:var(--bd2);transform:translateY(-2px);}
.video-thumb{width:100%;aspect-ratio:9/16;object-fit:cover;background:var(--bg3);display:block;}
.video-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.88) 0%,transparent 50%);display:flex;flex-direction:column;justify-content:flex-end;padding:.65rem;opacity:0;transition:opacity .2s;}
.video-card:hover .video-overlay{opacity:1;}
.video-title{font-size:.7rem;color:var(--white);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:.38rem;}
.video-author{display:flex;align-items:center;gap:5px;}
.video-author-avatar{width:16px;height:16px;border-radius:50%;object-fit:cover;background:var(--bg3);}
.video-author-name{font-size:.62rem;color:rgba(255,255,255,.75);font-family:var(--fh);font-weight:700;}
.video-stats{position:absolute;top:.55rem;right:.55rem;display:flex;flex-direction:column;gap:3px;}
.video-stat{background:rgba(0,0,0,.65);border-radius:4px;padding:2px 5px;font-size:.58rem;color:rgba(255,255,255,.8);font-family:var(--fh);font-weight:700;}
.video-info{padding:.55rem .7rem;background:var(--bg4);}
.video-info-title{font-size:.7rem;color:var(--muted3);line-height:1.4;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}

/* pinterest */
.pinterest-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;}
.pin-card{border-radius:7px;overflow:hidden;cursor:pointer;position:relative;background:var(--bg3);transition:all .2s;}
.pin-card:hover{transform:scale(1.02);box-shadow:0 6px 24px rgba(0,0,0,.4);}
.pin-img{width:100%;display:block;object-fit:cover;background:var(--bg3);}
.pin-overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;padding:.45rem;opacity:0;transition:opacity .2s;}
.pin-card:hover .pin-overlay{opacity:1;}
.pin-title{font-size:.63rem;color:var(--white);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

/* lyrics */
.lyrics-card{background:var(--bg4);border:1px solid var(--bd);border-radius:9px;overflow:hidden;}
.lyrics-header{display:flex;align-items:center;gap:.8rem;padding:.85rem .95rem;border-bottom:1px solid var(--bd);}
.lyrics-cover{width:48px;height:48px;border-radius:7px;object-fit:cover;background:var(--bg3);flex-shrink:0;}
.lyrics-meta{flex:1;min-width:0;}
.lyrics-title{font-family:var(--fh);font-size:.85rem;font-weight:800;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lyrics-artist{font-size:.7rem;color:var(--muted2);margin-top:2px;}
.lyrics-copy-btn{padding:5px 12px;border-radius:5px;border:1px solid var(--bd2);background:transparent;color:var(--muted3);font-size:.66rem;cursor:pointer;font-family:var(--fb);transition:all .18s;flex-shrink:0;}
.lyrics-copy-btn:hover{color:var(--white);border-color:var(--bd2);}
.lyrics-copy-btn.copied{color:#86efac;border-color:rgba(34,197,94,.25);}
.lyrics-body{padding:.85rem .95rem;max-height:300px;overflow-y:auto;font-size:.79rem;line-height:2;color:var(--muted3);white-space:pre-wrap;}

/* mcpe */
.mcpe-grid{display:flex;flex-direction:column;gap:6px;}
.mcpe-item{display:flex;align-items:center;gap:9px;background:var(--bg4);border:1px solid var(--bd);border-radius:8px;padding:.65rem .85rem;text-decoration:none;transition:border .18s;}
.mcpe-item:hover{border-color:var(--bd2);}
.mcpe-thumb{width:44px;height:44px;border-radius:7px;object-fit:cover;background:var(--bg3);flex-shrink:0;}
.mcpe-info{flex:1;min-width:0;}
.mcpe-title{font-family:var(--fh);font-size:.77rem;font-weight:700;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mcpe-rating{font-size:.65rem;color:var(--muted2);margin-top:2px;}

/* ssweb */
.ssweb-card{background:var(--bg4);border:1px solid var(--bd);border-radius:9px;overflow:hidden;}
.ssweb-bar{display:flex;align-items:center;gap:.45rem;padding:.55rem .85rem;background:rgba(255,255,255,.025);border-bottom:1px solid var(--bd);}
.ssweb-dots{display:flex;gap:4px;}
.ssweb-dot{width:8px;height:8px;border-radius:50%;}
.ssweb-url{font-size:.65rem;color:var(--muted2);font-family:'Fira Code',Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.ssweb-badge{font-size:.56rem;padding:2px 7px;border-radius:3px;border:1px solid var(--bd);background:transparent;color:var(--muted2);font-family:var(--fh);font-weight:700;letter-spacing:.06em;flex-shrink:0;}
.ssweb-img{width:100%;display:block;cursor:zoom-in;}

/* earnings */
.earnings-card{background:var(--bg4);border:1px solid var(--bd);border-radius:9px;padding:.95rem;}
.earnings-user{display:flex;align-items:center;gap:.75rem;margin-bottom:.85rem;}
.earnings-avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:var(--bg3);flex-shrink:0;}
.earnings-name{font-family:var(--fh);font-size:.88rem;font-weight:800;color:var(--white);}
.earnings-handle{font-size:.69rem;color:var(--muted2);}
.earnings-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:.85rem;}
.earnings-stat{background:var(--bg3);border-radius:7px;padding:.55rem .75rem;}
.earnings-stat-val{font-family:var(--fh);font-size:.92rem;font-weight:800;color:var(--white);}
.earnings-stat-lbl{font-size:.59rem;color:var(--muted2);text-transform:uppercase;letter-spacing:.06em;margin-top:1px;}
.earnings-range{background:rgba(34,197,94,.05);border:1px solid rgba(34,197,94,.14);border-radius:7px;padding:.65rem .85rem;}
.earnings-range-title{font-size:.62rem;color:#86efac;font-family:var(--fh);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.4rem;}
.earnings-range-val{font-family:var(--fh);font-size:1rem;font-weight:800;color:#86efac;}
.earnings-range-idr{font-size:.7rem;color:rgba(134,239,172,.55);margin-top:2px;}

/* npm */
.npm-card{background:var(--bg4);border:1px solid var(--bd);border-radius:9px;padding:.95rem;}
.npm-hd{display:flex;align-items:flex-start;gap:.65rem;margin-bottom:.75rem;}
.npm-icon{width:36px;height:36px;border-radius:8px;background:#CB3837;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-family:var(--fh);font-weight:800;color:#fff;flex-shrink:0;}
.npm-name{font-family:var(--fh);font-size:.88rem;font-weight:800;color:var(--white);}
.npm-desc{font-size:.71rem;color:var(--muted2);margin-top:2px;line-height:1.4;}
.npm-rows{display:flex;flex-direction:column;gap:4px;}
.npm-row{display:flex;justify-content:space-between;align-items:center;font-size:.71rem;padding:.28rem 0;border-bottom:1px solid var(--bd);}
.npm-row:last-child{border:none;}
.npm-row-key{color:var(--muted2);}
.npm-row-val{color:var(--white);font-family:'Fira Code',Consolas,monospace;font-size:.68rem;text-align:right;word-break:break-all;max-width:60%;}
.npm-kw{display:flex;flex-wrap:wrap;gap:4px;margin-top:.65rem;}
.npm-kw span{font-size:.6rem;padding:2px 7px;border-radius:4px;background:rgba(255,255,255,.03);border:1px solid var(--bd);color:var(--muted3);}

/* video modal */
.vid-modal{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(8px);}
.vid-modal.open{display:flex;animation:mup .2s ease;}
.vid-modal-inner{background:var(--bg2);border:1px solid var(--bd2);border-radius:14px;overflow:hidden;max-width:360px;width:100%;position:relative;}
.vid-modal-close{position:absolute;top:.65rem;right:.65rem;width:28px;height:28px;border-radius:5px;background:rgba(0,0,0,.6);border:1px solid var(--bd);color:var(--muted3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.75rem;z-index:1;transition:all .15s;}
.vid-modal-close:hover{color:var(--white);background:rgba(26,108,246,.2);}
.vid-modal video{width:100%;max-height:70vh;display:block;background:#000;}
.vid-modal-meta{padding:.75rem .95rem;}
.vid-modal-title{font-size:.78rem;color:var(--muted3);line-height:1.5;margin-bottom:.45rem;}
.vid-modal-author{display:flex;align-items:center;gap:5px;}
.vid-modal-avatar{width:22px;height:22px;border-radius:50%;object-fit:cover;background:var(--bg3);}
.vid-modal-name{font-size:.7rem;color:var(--white);font-family:var(--fh);font-weight:700;}
.vid-modal-stats{display:flex;gap:.75rem;margin-top:.55rem;}
.vid-modal-stat{font-size:.63rem;color:var(--muted2);}
.vid-modal-stat b{color:var(--muted3);}

/* screenshot modal */
.ss-modal{position:fixed;inset:0;z-index:9001;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:1rem;cursor:zoom-out;}
.ss-modal.open{display:flex;}
.ss-modal img{max-width:94vw;max-height:92vh;border-radius:8px;object-fit:contain;}

/* settings modal */
.settings-modal{position:fixed;inset:0;z-index:8000;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(6px);}
.settings-modal.open{display:flex;animation:mup .2s ease;}
.settings-inner{background:var(--bg2);border:1px solid var(--bd2);border-radius:14px;padding:1.5rem;width:100%;max-width:400px;position:relative;}
.settings-title{font-family:var(--fh);font-size:.95rem;font-weight:800;margin-bottom:1.2rem;letter-spacing:-.01em;}
.settings-close{position:absolute;top:.95rem;right:.95rem;width:26px;height:26px;border-radius:5px;background:transparent;border:1px solid var(--bd);color:var(--muted3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.72rem;}
.settings-close:hover{color:var(--white);}
.settings-section{margin-bottom:1.1rem;}
.settings-lbl{font-size:.6rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted2);margin-bottom:.55rem;display:block;}
.settings-actions{display:flex;flex-direction:column;gap:.45rem;}
.settings-btn{display:flex;align-items:center;gap:.55rem;padding:.65rem .9rem;border-radius:7px;border:1px solid var(--bd2);background:transparent;color:var(--muted3);font-family:var(--fb);font-size:.78rem;cursor:pointer;transition:all .18s;text-align:left;width:100%;text-decoration:none;}
.settings-btn:hover{color:var(--white);border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.035);}
.settings-btn.danger{border-color:rgba(26,108,246,.2);color:var(--blue4);}
.settings-btn.danger:hover{background:rgba(26,108,246,.07);border-color:rgba(26,108,246,.35);}
.sbtn-icon{font-size:.95rem;flex-shrink:0;}
.sbtn-info{flex:1;min-width:0;}
.sbtn-label{font-weight:600;color:inherit;display:block;}
.sbtn-sub{font-size:.64rem;color:var(--muted2);margin-top:1px;}

/* INPUT */
.input-wrap{padding:.75rem 1.2rem .9rem;border-top:1px solid var(--bd);background:var(--bg);flex-shrink:0;}
.input-box{
  max-width:780px;margin:0 auto;
  display:flex;gap:7px;align-items:flex-end;
  background:var(--bg2);border:1px solid var(--bd2);
  border-radius:10px;padding:6px 6px 6px 14px;
  transition:border .2s;
}
.input-box:focus-within{border-color:rgba(26,108,246,.3);}
.chat-ta{
  flex:1;background:transparent;border:none;outline:none;
  color:var(--white);font-family:var(--fb);font-size:.875rem;
  resize:none;min-height:36px;max-height:140px;padding:6px 0;line-height:1.5;
}
.chat-ta::placeholder{color:var(--muted2);}
.btn-send{
  width:36px;height:36px;background:var(--blue);border:none;border-radius:7px;
  cursor:pointer;color:white;display:flex;align-items:center;justify-content:center;
  transition:all .18s;flex-shrink:0;
}
.btn-send:hover{background:var(--blue2);transform:scale(1.04);}
.btn-send:disabled{opacity:.25;cursor:not-allowed;transform:none;}
.input-hint{max-width:780px;margin:.3rem auto 0;font-size:.6rem;color:var(--muted);text-align:center;}

/* toast */
.toast{position:fixed;bottom:1.2rem;right:1.2rem;z-index:9999;background:var(--bg4);border:1px solid var(--bd2);border-radius:7px;padding:7px 15px;font-size:.76rem;transform:translateY(8px);opacity:0;transition:all .22s;pointer-events:none;}
.toast.show{transform:none;opacity:1;}
.toast.ok{border-color:rgba(34,197,94,.2);color:#86efac;}
.toast.err{border-color:rgba(26,108,246,.28);color:var(--blue4);}

/* MOBILE */
@media(max-width:700px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .25s;z-index:200;}
  .sidebar.open{transform:none;box-shadow:8px 0 32px rgba(0,0,0,.55);}
  .sb-toggle{display:flex!important;}
  .sb-overlay{display:none;position:fixed;inset:0;z-index:199;background:rgba(0,0,0,.5);}
  .sb-overlay.show{display:block;}
  .video-grid{grid-template-columns:repeat(2,1fr);}
  .pinterest-grid{grid-template-columns:repeat(2,1fr);}
  .tbtn span{display:none;}
}
@media(max-width:420px){
  .video-grid{grid-template-columns:1fr;}
  .tiktok-profile{flex-direction:column;}
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sb-head">
    <a class="sb-brand" href="/">
      <div class="sb-logo"><img src="/media/logo.png" alt="Axon AI"/></div>
      <span class="sb-brand-text">Axon<em>.</em>AI</span>
    </a>
    <button class="btn-new" onclick="newSession()">
      <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="1" x2="6" y2="11"/><line x1="1" y1="6" x2="11" y2="6"/></svg>
      Baru
    </button>
  </div>
  <div class="sb-label">Riwayat Sesi</div>
  <div class="sb-list" id="sb-list"></div>
  <div class="sb-foot">
    <strong>Axon AI</strong> by WebPublish<br/>
    Owner: <a href="/">Saurus</a>
  </div>
</aside>

<div class="sb-overlay" id="sb-overlay" onclick="closeSidebar()"></div>

<!-- CHAT MAIN -->
<div class="chat-main">
  <div class="topbar">
    <div class="topbar-l">
      <button class="sb-toggle" id="sb-toggle" onclick="toggleSidebar()">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/></svg>
      </button>
      <div class="sess-label" id="sess-label">Sesi &mdash; <em>&mdash;</em></div>
    </div>
    <div class="topbar-r">
      <div class="model-wrap" id="model-wrap">
        <button class="model-btn" id="model-btn" onclick="toggleModelDrop()">
          <span id="model-btn-txt">Loading...</span>
          <svg width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="2,3 5,7 8,3"/></svg>
        </button>
        <div class="model-drop" id="model-drop"></div>
      </div>
      <button class="tbtn" onclick="openSettings()">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="2.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.22 3.22l1.42 1.42M11.36 11.36l1.42 1.42M3.22 12.78l1.42-1.42M11.36 4.64l1.42-1.42"/></svg>
        <span>Pengaturan</span>
      </button>
      <a class="back-btn" href="/">
        <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><polyline points="9,2 4,7 9,12"/></svg>
        Home
      </a>
    </div>
  </div>

  <div class="msgs" id="msgs">
    <div class="empty-state" id="empty-state">
      <div class="empty-logo"><img src="/media/logo.png" alt=""/></div>
      <div class="empty-title">Axon AI</div>
      <div class="empty-sub">Asisten AI dari WebPublish. Tanya apapun, Axon siap menjawab.</div>

  </div>

  <div class="input-wrap">
    <div class="input-box">
      <textarea class="chat-ta" id="chat-ta"
        placeholder="Tanya sesuatu atau minta Axon cari informasi..."
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"
        oninput="autoResize(this)"></textarea>
      <button class="btn-send" id="btn-send" onclick="sendChat()">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="14" x2="8" y2="2"/><polyline points="3,7 8,2 13,7"/></svg>
      </button>

    <div class="input-hint">Enter kirim &middot; Shift+Enter baris baru</div>

</div>

<!-- VIDEO MODAL -->
<div class="vid-modal" id="vid-modal">
  <div class="vid-modal-inner">
    <button class="vid-modal-close" onclick="closeVidModal()">&#x2715;</button>
    <video id="vid-player" controls autoplay playsinline></video>
    <div class="vid-modal-meta">
      <div class="vid-modal-title" id="vid-modal-title"></div>
      <div class="vid-modal-author">
        <img class="vid-modal-avatar" id="vid-modal-avatar" src="" alt=""/>
        <div class="vid-modal-name" id="vid-modal-name"></div>
      </div>
      <div class="vid-modal-stats" id="vid-modal-stats"></div>
    </div>

</div>

<!-- SCREENSHOT MODAL -->
<div class="ss-modal" id="ss-modal" onclick="closeSSModal()">
  <img id="ss-modal-img" src="" alt="screenshot"/>
</div>

<!-- SETTINGS MODAL -->
<div class="settings-modal" id="settings-modal">
  <div class="settings-inner">
    <button class="settings-close" onclick="closeSettings()">&#x2715;</button>
    <div class="settings-title">Pengaturan</div>
    <div class="settings-section">
      <span class="settings-lbl">Sesi &amp; Riwayat</span>
      <div class="settings-actions">
        <button class="settings-btn" onclick="exportChat()">
          <span class="sbtn-icon">&#x1F4E5;</span>
          <div class="sbtn-info"><span class="sbtn-label">Export Riwayat Chat</span><span class="sbtn-sub">Unduh semua sesi aktif sebagai file .json</span></div>
        </button>
        <button class="settings-btn danger" onclick="clearAllSessions()">
          <span class="sbtn-icon">&#x1F5D1;</span>
          <div class="sbtn-info"><span class="sbtn-label">Hapus Semua Sesi</span><span class="sbtn-sub">Semua riwayat percakapan dihapus permanen</span></div>
        </button>
      </div>
    </div>
    <div class="settings-section">
      <span class="settings-lbl">Navigasi</span>
      <div class="settings-actions">
        <a class="settings-btn" href="/">
          <span class="sbtn-icon">&#x1F3E0;</span>
          <div class="sbtn-info"><span class="sbtn-label">Kembali ke Home</span><span class="sbtn-sub">Ke halaman utama Axon AI</span></div>
        </a>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* MARKED CONFIG */
if (typeof marked !== 'undefined') {
  const r = new marked.Renderer();
  r.code = function(code, lang) {
    const id = 'cb-' + Math.random().toString(36).slice(2,8);
    const l = lang || 'code';
    const e = String(code).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    return `<pre><div class="code-hd"><span class="code-lang">${l}</span><button class="code-copy" id="${id}" onclick="copyCode(this,'${id}')">Salin</button></div><code id="raw-${id}" style="display:none">${e}</code><code>${e}</code></pre>`;
  };
  marked.use({ renderer: r, breaks: true, gfm: true });
}
function copyCode(btn, id) {
  const raw = document.getElementById('raw-' + id);
  navigator.clipboard.writeText(raw ? raw.textContent : '').then(() => {
    btn.textContent = 'Tersalin!'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Salin'; btn.classList.remove('copied'); }, 2000);
  });
}

/* MODELS */
let availableModels = [], activeModelId = null;
async function loadModels() {
  try {
    const res  = await fetch('/api/models');
    const data = await res.json();
    availableModels = data.models || [];
    const def = availableModels.find(m => m.default) || availableModels[0];
    activeModelId = localStorage.getItem('axon_model') || def?.id;
    if (!availableModels.find(m => m.id === activeModelId)) activeModelId = def?.id;
    renderModelDrop();
  } catch(e) { console.error('loadModels:', e); }
}
function renderModelDrop() {
  const active = availableModels.find(m => m.id === activeModelId);
  document.getElementById('model-btn-txt').textContent = active?.name || 'Model';
  document.getElementById('model-drop').innerHTML = availableModels.map(m =>
    `<div class="mopt ${m.id===activeModelId?'active':''}" onclick="selectModel('${m.id}')">
      <div class="mopt-icon">&#x26A1;</div>
      <div>
        <div class="mopt-name">${esc(m.name)}<span class="mopt-badge">${esc(m.badge||'')}</span></div>
        <div class="mopt-desc">${esc(m.description||'')}</div>
      </div>
    </div>`).join('');
}
function toggleModelDrop() {
  const btn = document.getElementById('model-btn');
  const drop = document.getElementById('model-drop');
  const open = drop.classList.toggle('show');
  btn.classList.toggle('open', open);
}
function selectModel(id) {
  activeModelId = id;
  localStorage.setItem('axon_model', id);
  renderModelDrop();
  document.getElementById('model-drop').classList.remove('show');
  document.getElementById('model-btn').classList.remove('open');
  toast('Model: ' + (availableModels.find(m=>m.id===id)?.name || id));
}
document.addEventListener('click', e => {
  if (!document.getElementById('model-wrap').contains(e.target)) {
    document.getElementById('model-drop').classList.remove('show');
    document.getElementById('model-btn').classList.remove('open');
  }
});

/* SESSIONS */
let sessions = [], activeIdx = 0;
function save() { try { localStorage.setItem('axon_sessions', JSON.stringify(sessions)); localStorage.setItem('axon_active', activeIdx); } catch(e) {} }
function load() {
  try { const s=localStorage.getItem('axon_sessions'), a=localStorage.getItem('axon_active'); if(s) sessions=JSON.parse(s); if(a!==null) activeIdx=Math.min(parseInt(a)||0,Math.max(0,sessions.length-1)); } catch(e){sessions=[];}
  if (!sessions.length) _mkSession();
}
function _rId() { return 'saurus-'+Math.floor(10000+Math.random()*90000); }
function _mkSession() { sessions.unshift({ id: _rId(), apiId: _rId(), preview: 'Sesi baru', messages: [] }); activeIdx=0; save(); }
function newSession() { _mkSession(); render(); toast('Sesi baru dibuat'); }
function switchSession(idx) { activeIdx=idx; save(); render(); closeSidebar(); }
function deleteSession(idx, e) {
  e.stopPropagation(); sessions.splice(idx,1);
  if (!sessions.length) _mkSession();
  if (activeIdx>=sessions.length) activeIdx=0;
  save(); render();
}

/* RENDER */
function render() { renderSidebar(); renderMessages(); }
function renderSidebar() {
  const el=document.getElementById('sb-list');
  if (!sessions.length) { el.innerHTML='<div style="padding:1rem 1.2rem;font-size:.71rem;color:var(--muted)">Belum ada sesi</div>'; return; }
  el.innerHTML=sessions.map((s,i)=>`
    <div class="sitem ${i===activeIdx?'active':''}" onclick="switchSession(${i})">
      <div class="sitem-dot"></div>
      <div class="sitem-info">
        <div class="sitem-name">${esc(s.id)}</div>
        <div class="sitem-prev">${esc(s.preview)}</div>
      </div>
      <button class="sitem-del" onclick="deleteSession(${i},event)">&#x2715;</button>
    </div>`).join('');
}
function renderMessages() {
  const s=sessions[activeIdx]; if(!s) return;
  document.getElementById('sess-label').innerHTML=`Sesi &mdash; <em>${esc(s.id)}</em>`;
  const area=document.getElementById('msgs');
  if (!s.messages.length) { area.innerHTML=`<div class="empty-state"><div class="empty-logo"><img src="/media/logo.png" alt=""/></div><div class="empty-title">Axon AI</div><div class="empty-sub">Tanya apapun, Axon siap menjawab.</div></div>`; return; }
  area.innerHTML=s.messages.map(m=>buildMsgHTML(m)).join('');
  area.scrollTop=area.scrollHeight;
}

/* MSG BUILDER */
function buildMsgHTML(m) {
  const isUser=m.role==='user';
  let copyBtn='';
  if (!isUser) {
    const raw=m._rawText||'';
    copyBtn=`<button class="msg-copy-btn" onclick="copyMsg(this,'${btoa(unescape(encodeURIComponent(raw)))}')"><svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="7" height="7" rx="1"/><path d="M8 4V3a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h1"/></svg>Salin</button>`;
  }
  let toolHTML=!isUser&&m.tool?buildToolHTML(m.tool):'';
  const bub=isUser?`<div class="msg-bub">${m.html}</div>`:`<div class="msg-bub">${m.html||''}${toolHTML}</div>`;
  return `<div class="msg ${m.role}">
    <div class="msg-av">${isUser?'KM':'AI'}</div>
    <div class="msg-body">
      <div class="msg-who">${isUser?'Kamu':'Axon AI'}${copyBtn}</div>
      ${bub}
    </div>
  </div>`;
}
function copyMsg(btn, b64) {
  try {
    const text=decodeURIComponent(escape(atob(b64)));
    navigator.clipboard.writeText(text).then(()=>{
      btn.innerHTML='&#x2713; Tersalin'; btn.classList.add('copied');
      setTimeout(()=>{ btn.innerHTML='<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="7" height="7" rx="1"/><path d="M8 4V3a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v4a1 1 0 0 0 1 1h1"/></svg>Salin'; btn.classList.remove('copied'); },2000);
    });
  } catch(e) {}
}

function buildToolHTML(tool) {
  if (!tool) return '';
  if (tool.error) return `<div class="tool-badge err">Gagal: ${esc(tool.error)}</div>`;
  switch(tool.type) {
    case 'websearch':      return buildWebSearch(tool.data);
    case 'tiktokstalk':    return buildTikTokProfile(tool.data);
    case 'tiktokvideo':    return buildVideoGrid(tool.data);
    case 'pinterest':      return buildPinterestGrid(tool.data);
    case 'lyrics':         return buildLyrics(tool.data);
    case 'mcpe':           return buildMcpe(tool.data);
    case 'ssweb':          return buildSSweb(tool.data);
    case 'tiktokearnings': return buildEarnings(tool.data);
    case 'npm':            return buildNpm(tool.data);
    default: return '';
  }
}

function buildWebSearch(results) {
  if (!results?.length) return '<div class="tool-badge err">Tidak ada hasil.</div>';
  return `<div class="tool-result"><div class="tool-badge done">&#x2713; ${results.length} hasil ditemukan</div>
    <div class="search-results">${results.map(r=>`<div class="search-item">
      <div class="search-item-title">${esc(r.title)}</div>
      <div class="search-item-snippet">${esc(r.snippet)}</div>
      ${r.url?`<div class="search-item-url">${esc(r.url)}</div>`:''}
    </div>`).join('')}</div></div>`;
}
function buildTikTokProfile(info) {
  if (!info) return '<div class="tool-badge err">Profil tidak ditemukan.</div>';
  const u=info.user||{}, s=info.stats||{};
  const av=u.avatarMedium||u.avatarLarger||'';
  const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':(n||0).toString();
  return `<div class="tool-result"><div class="tool-badge done">&#x2713; Profil TikTok</div>
    <div class="tiktok-profile">
      ${av?`<img class="tiktok-avatar" src="${esc(av)}" alt="" onerror="this.style.display='none'"/>`:'' }
      <div class="tiktok-info">
        <div class="tiktok-nickname">${esc(u.nickname||'-')}${u.verified?'<span class="tiktok-verified">&#x2713; Verified</span>':''}</div>
        <div class="tiktok-username">@${esc(u.uniqueId||'-')}</div>
        ${u.signature?`<div class="tiktok-bio">${esc(u.signature)}</div>`:''}
        <div class="tiktok-stats">
          <div><span class="tiktok-stat-num">${fmt(s.followingCount)}</span><span class="tiktok-stat-lbl">Following</span></div>
          <div><span class="tiktok-stat-num">${fmt(s.followerCount)}</span><span class="tiktok-stat-lbl">Followers</span></div>
          <div><span class="tiktok-stat-num">${fmt(s.heartCount||s.diggCount)}</span><span class="tiktok-stat-lbl">Likes</span></div>
          <div><span class="tiktok-stat-num">${fmt(s.videoCount)}</span><span class="tiktok-stat-lbl">Video</span></div>
        </div>
      </div>
    </div></div>`;
}
const _videos={};
function buildVideoGrid(videos) {
  if (!videos?.length) return '<div class="tool-badge err">Tidak ada video.</div>';
  const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':(n||0).toString();
  const cards=videos.map((v,i)=>{
    const k='v_'+Date.now()+'_'+i; _videos[k]=v;
    const cv=v.origin_cover||v.cover||'';
    return `<div class="video-card" onclick="openVideo('${k}')">
      <img class="video-thumb" src="${esc(cv)}" alt="${esc(v.title||'')}" loading="lazy" onerror="this.src=''"/>
      <div class="video-stats"><div class="video-stat">&#x25B6; ${fmt(v.stats?.plays)}</div><div class="video-stat">&#x2665; ${fmt(v.stats?.likes)}</div></div>
      <div class="video-overlay">
        <div class="video-title">${esc(v.title||'')}</div>
        <div class="video-author">
          ${v.author?.avatar?`<img class="video-author-avatar" src="${esc(v.author.avatar)}" onerror="this.style.display='none'"/>`:'' }
          <span class="video-author-name">${esc(v.author?.nickname||'')}</span>
        </div>
      </div>
      <div class="video-info"><div class="video-info-title">${esc(v.title||'')}</div></div>
    </div>`;
  }).join('');
  return `<div class="tool-result"><div class="tool-badge done">&#x25B6; ${videos.length} video TikTok</div><div class="video-grid">${cards}</div></div>`;
}
function buildPinterestGrid(pins) {
  if (!pins?.length) return '<div class="tool-badge err">Tidak ada foto.</div>';
  return `<div class="tool-result"><div class="tool-badge done">&#x1F4CC; ${pins.length} foto Pinterest</div>
    <div class="pinterest-grid">${pins.map(p=>`<a class="pin-card" href="${esc(p.source)}" target="_blank" rel="noopener">
      <img class="pin-img" src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy" onerror="this.parentElement.style.display='none'"/>
      <div class="pin-overlay"><div class="pin-title">${esc(p.title)}</div></div>
    </a>`).join('')}</div></div>`;
}
function buildLyrics(d) {
  if (!d) return '<div class="tool-badge err">Lirik tidak ditemukan.</div>';
  const lid='lyr-'+Math.random().toString(36).slice(2,8);
  return `<div class="tool-result"><div class="tool-badge done">&#x1F3B5; Lirik ditemukan</div>
    <div class="lyrics-card">
      <div class="lyrics-header">
        ${d.cover?`<img class="lyrics-cover" src="${esc(d.cover)}" alt="" onerror="this.style.display='none'"/>`:'' }
        <div class="lyrics-meta"><div class="lyrics-title">${esc(d.title||'-')}</div><div class="lyrics-artist">${esc(d.artist||'-')}</div></div>
        <button class="lyrics-copy-btn" id="${lid}-btn" onclick="copyLyrics('${lid}')">Salin Lirik</button>
      </div>
      <div class="lyrics-body" id="${lid}">${esc(d.lyrics||'Lirik tidak tersedia.')}</div>
    </div></div>`;
}
function copyLyrics(id) {
  const el=document.getElementById(id), btn=document.getElementById(id+'-btn'); if(!el) return;
  navigator.clipboard.writeText(el.innerText).then(()=>{ btn.textContent='Tersalin!'; btn.classList.add('copied'); setTimeout(()=>{ btn.textContent='Salin Lirik'; btn.classList.remove('copied'); },2000); });
}
function buildMcpe(items) {
  if (!items?.length) return '<div class="tool-badge err">Addon tidak ditemukan.</div>';
  return `<div class="tool-result"><div class="tool-badge done">&#x1F9F1; ${items.length} addon MCPE</div>
    <div class="mcpe-grid">${items.map(a=>`<a class="mcpe-item" href="${esc(a.link)}" target="_blank" rel="noopener">
      ${a.image?`<img class="mcpe-thumb" src="${esc(a.image)}" alt="" loading="lazy" onerror="this.style.display='none'"/>`:'' }
      <div class="mcpe-info"><div class="mcpe-title">${esc(a.title)}</div><div class="mcpe-rating">&#x2605; ${esc(a.rating)}</div></div>
    </a>`).join('')}</div></div>`;
}
function buildSSweb(d) {
  if (!d?.imageUrl) return '<div class="tool-badge err">Screenshot gagal.</div>';
  return `<div class="tool-result"><div class="tool-badge done">&#x1F4F8; Screenshot ${d.mode||'desktop'}</div>
    <div class="ssweb-card">
      <div class="ssweb-bar">
        <div class="ssweb-dots"><div class="ssweb-dot" style="background:#ff5f57"></div><div class="ssweb-dot" style="background:#febc2e"></div><div class="ssweb-dot" style="background:#28c840"></div></div>
        <div class="ssweb-url">${esc(d.url||'')}</div>
        <div class="ssweb-badge">${esc((d.mode||'desktop').toUpperCase())}</div>
      </div>
      <img class="ssweb-img" src="${esc(d.imageUrl)}" alt="screenshot" loading="lazy" onclick="openSSModal('${esc(d.imageUrl)}')"/>
    </div></div>`;
}
function buildEarnings(d) {
  if (!d) return '<div class="tool-badge err">Data tidak ditemukan.</div>';
  const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':(n||0).toString();
  return `<div class="tool-result"><div class="tool-badge done">&#x1F4B0; Estimasi penghasilan TikTok</div>
    <div class="earnings-card">
      <div class="earnings-user">
        ${d.avatar?`<img class="earnings-avatar" src="${esc(d.avatar)}" alt="" onerror="this.style.display='none'"/>`:'' }
        <div><div class="earnings-name">${esc(d.nickname||'-')}</div><div class="earnings-handle">@${esc(d.unique_id||'-')}</div></div>
      </div>
      <div class="earnings-stats">
        <div class="earnings-stat"><div class="earnings-stat-val">${fmt(d.followers)}</div><div class="earnings-stat-lbl">Followers</div></div>
        <div class="earnings-stat"><div class="earnings-stat-val">${fmt(d.likes)}</div><div class="earnings-stat-lbl">Likes</div></div>
        <div class="earnings-stat"><div class="earnings-stat-val">${fmt(d.videos)}</div><div class="earnings-stat-lbl">Video</div></div>
        <div class="earnings-stat"><div class="earnings-stat-val">${d.engagement}%</div><div class="earnings-stat-lbl">Engagement</div></div>
      </div>
      <div class="earnings-range">
        <div class="earnings-range-title">Estimasi per Post</div>
        <div class="earnings-range-val">${esc(d.earnings?.per_post_min||'-')} &mdash; ${esc(d.earnings?.per_post_max||'-')}</div>
        <div class="earnings-range-idr">${esc(d.earnings?.per_post_min_idr||'')} &mdash; ${esc(d.earnings?.per_post_max_idr||'')}</div>
      </div>
    </div></div>`;
}
function buildNpm(d) {
  if (!d) return '<div class="tool-badge err">Package tidak ditemukan.</div>';
  const rows=[['Versi terbaru',d.version_latest],['Versi pertama',d.version_first],['Total versi',d.total_versions],['Dependensi',d.deps_latest],['Author',d.author||'-'],['License',d.license||'-'],['Dibuat',d.published_at?new Date(d.published_at).toLocaleDateString('id-ID'):'-'],['Update terakhir',d.latest_published?new Date(d.latest_published).toLocaleDateString('id-ID'):'-']];
  return `<div class="tool-result"><div class="tool-badge done">&#x1F4E6; NPM: ${esc(d.name)}</div>
    <div class="npm-card">
      <div class="npm-hd"><div class="npm-icon">npm</div><div><div class="npm-name">${esc(d.name)}</div><div class="npm-desc">${esc(d.description||'-')}</div></div></div>
      <div class="npm-rows">${rows.map(([k,v])=>`<div class="npm-row"><span class="npm-row-key">${k}</span><span class="npm-row-val">${esc(String(v??'-'))}</span></div>`).join('')}</div>
      ${d.keywords?.length?`<div class="npm-kw">${d.keywords.map(k=>`<span>${esc(k)}</span>`).join('')}</div>`:''}
    </div></div>`;
}

/* MODALS */
function openVideo(key) {
  const v=_videos[key]; if(!v) return;
  const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':(n||0).toString();
  document.getElementById('vid-player').src=v.play||v.wmplay||'';
  document.getElementById('vid-modal-title').textContent=v.title||'';
  document.getElementById('vid-modal-avatar').src=v.author?.avatar||'';
  document.getElementById('vid-modal-name').textContent=v.author?.nickname||'';
  document.getElementById('vid-modal-stats').innerHTML=`<span class="vid-modal-stat"><b>${fmt(v.stats?.plays)}</b> plays</span><span class="vid-modal-stat"><b>${fmt(v.stats?.likes)}</b> likes</span><span class="vid-modal-stat"><b>${fmt(v.stats?.comments)}</b> komentar</span>`;
  document.getElementById('vid-modal').classList.add('open');
}
function closeVidModal() { document.getElementById('vid-modal').classList.remove('open'); const p=document.getElementById('vid-player'); p.pause(); p.src=''; }
document.getElementById('vid-modal').addEventListener('click', e=>{ if(e.target===document.getElementById('vid-modal')) closeVidModal(); });
function openSSModal(url) { document.getElementById('ss-modal-img').src=url; document.getElementById('ss-modal').classList.add('open'); }
function closeSSModal() { document.getElementById('ss-modal').classList.remove('open'); }
function openSettings() { document.getElementById('settings-modal').classList.add('open'); }
function closeSettings() { document.getElementById('settings-modal').classList.remove('open'); }
document.getElementById('settings-modal').addEventListener('click', e=>{ if(e.target===document.getElementById('settings-modal')) closeSettings(); });

/* SETTINGS */
function exportChat() {
  const blob=new Blob([JSON.stringify(sessions,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=`axon-ai-export-${Date.now()}.json`;
  a.click(); URL.revokeObjectURL(url); toast('Chat berhasil diekspor!');
}
function clearAllSessions() {
  if (!confirm('Yakin hapus semua sesi? Tidak bisa dibatalkan.')) return;
  sessions=[]; _mkSession(); save(); render(); closeSettings(); toast('Semua sesi dihapus.');
}

/* DOM HELPERS */
function appendMsg(m) {
  const area=document.getElementById('msgs');
  area.querySelector('.empty-state')?.remove();
  const d=document.createElement('div'); d.innerHTML=buildMsgHTML(m);
  area.appendChild(d.firstElementChild); area.scrollTop=area.scrollHeight;
}
function appendTyping() {
  const area=document.getElementById('msgs');
  area.querySelector('.empty-state')?.remove();
  const d=document.createElement('div');
  d.className='msg bot'; d.id='typing-bub';
  d.innerHTML=`<div class="msg-av">AI</div><div class="msg-body"><div class="msg-who">Axon AI</div><div class="msg-bub"><div class="tdots"><span></span><span></span><span></span></div></div></div>`;
  area.appendChild(d); area.scrollTop=area.scrollHeight;
}
function updateTypingTool(toolName) {
  const tb=document.getElementById('typing-bub'); if(!tb) return;
  const labels={websearch:'Mencari di web...',tiktokstalk:'Mencari profil TikTok...',tiktokvideo:'Mencari video TikTok...',pinterest:'Mencari foto Pinterest...',lyrics:'Mencari lirik lagu...',mcpe:'Mencari addon MCPE...',ssweb:'Mengambil screenshot...',tiktokearnings:'Cek penghasilan TikTok...',npm:'Cek package NPM...'};
  tb.querySelector('.msg-bub').innerHTML=`<div class="tool-badge searching"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="5" r="4"/><line x1="8.5" y1="8.5" x2="11" y2="11"/></svg>${labels[toolName]||'Memproses...'}</div><div class="tdots" style="margin-top:6px"><span></span><span></span><span></span></div>`;
  document.getElementById('msgs').scrollTop=99999;
}

/* SEND */
async function sendChat() {
  const ta=document.getElementById('chat-ta');
  const txt=ta.value.trim(); if (!txt) return;
  const s=sessions[activeIdx];
  const btn=document.getElementById('btn-send');
  btn.disabled=true; ta.value=''; ta.style.height='auto';
  const userMsg={role:'user',html:esc(txt).replace(/\n/g,'<br>')};
  s.messages.push(userMsg);
  s.preview=txt.slice(0,44)+(txt.length>44?'\u2026':'');
  save(); appendMsg(userMsg); appendTyping(); renderSidebar();
  try {
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:txt,session_id:s.apiId,model_id:activeModelId})});
    const data=await res.json();
    if (data.tool) { updateTypingTool(data.tool.type); await new Promise(r=>setTimeout(r,300)); }
    document.getElementById('typing-bub')?.remove();
    const replyText=data.reply||'';
    const replyHtml=replyText?(typeof marked!=='undefined'?marked.parse(replyText):esc(replyText)):'';
    const botMsg={role:'bot',html:replyHtml,tool:data.tool||null,_rawText:replyText};
    s.messages.push(botMsg); save(); appendMsg(botMsg);
  } catch(e) {
    document.getElementById('typing-bub')?.remove();
    const errMsg={role:'bot',html:`<span style="color:var(--blue4)">Gagal: ${esc(e.message)}</span>`,tool:null,_rawText:''};
    s.messages.push(errMsg); save(); appendMsg(errMsg);
  }
  btn.disabled=false; renderSidebar();
}

/* UTILS */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,140)+'px';}
function toast(msg,t='ok'){const el=document.getElementById('toast');el.textContent=msg;el.className='toast show '+t;setTimeout(()=>el.classList.remove('show'),2600);}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('sb-overlay').classList.toggle('show');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('sb-overlay').classList.remove('show');}

/* INIT */
load(); loadModels();
setTimeout(()=>document.getElementById('chat-ta').focus(),80);
</script>
